[package]
name = "symbios-robot"
version = "0.5.0"
edition = "2024"
authors = ["Janus"]
description = "Engine-agnostic robot interpretation layer for Symbios L-Systems using glam."
license = "MIT"
readme = "README.md"
repository = "https://github.com/TheJanusStream/symbios-robot"
keywords = ["lsystem", "procedural", "generative", "simulation"]
categories = ["simulation", "game-development"]

[dependencies]
symbios = "1.5"
glam = { version = "0.33", features = ["serde"] }
bevy_heavy = { version = "0.6", default-features = false, features = [
    "3d",
    "std",
] }
bevy_math = { version = "0.20", default-features = false, features = ["std"] }
# Bevy 0.20 moved the primitive shapes and bounding volumes out of bevy_math.
bevy_shape = { version = "0.20", default-features = false, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"
